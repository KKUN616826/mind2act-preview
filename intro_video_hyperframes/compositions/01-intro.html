<script>(function(){const tl=gsap.timeline({paused:true});
// Camera: hold on the piano, then a two-stage pull-back with a held pause at the 3x3
// view, so the zoom reads in beats at 81 BPM (beat = 0.7407s):
//   0.00-0.37  hold on the single case (half beat)
//   0.37-1.11  pull back to the 3x3 view  (lands on beat 1.5)
//   1.11-1.48  hold — the rows start their drift under it (half-beat rest)
//   1.48-2.22  pull back to the whole wall (lands exactly on beat 3)
// Each leg eases in-out; scale moves in log space, so speed is even within a leg.
const G=8/3,CW=640-G,CH=480-G,CX=2560+CW/2,CY=960+CH/2;
const S_PIANO=1920/CW,S_MID=1,S_WALL=.452,T0=.37,T1=1.11,T2=1.48,T3=2.22;
function ez(u){return u<.5?2*u*u:1-2*(1-u)*(1-u);}
function cameraAt(t){const l0=Math.log(S_PIANO),l1=Math.log(S_MID),l2=Math.log(S_WALL);let ls=l0;
  if(t>=T3)ls=l2;
  else if(t>=T2)ls=l1+(l2-l1)*ez((t-T2)/(T3-T2));
  else if(t>=T1)ls=l1;
  else if(t>=T0)ls=l0+(l1-l0)*ez((t-T0)/(T1-T0));
  return{ls,cx:CX,cy:CY};}
// Carousel: rows start gliding at 1.25s and ease in, so motion hands off from the zoom.
const D0=1.25,D1=5.185185,DRIFT=544;
function drift(t){const k=Math.min(1,Math.max(0,(t-D0)/(D1-D0)));return DRIFT*(1-Math.cos(k*Math.PI/2));}
const rows=[0,1,2,3,4].map(r=>document.getElementById('intro-row-'+r));
const cam={t:0};
function applyCamera(){const c=cameraAt(cam.t),s=Math.exp(c.ls),cx=c.cx,cy=c.cy;
gsap.set('#intro-world',{x:960-cx*s,y:540-cy*s,scale:s,transformOrigin:'0 0'});
const d=drift(cam.t);rows.forEach((row,r)=>gsap.set(row,{x:r%2?d:-d}));}
applyCamera();
tl.to(cam,{t:5.185185,duration:5.185185,ease:'none',onUpdate:applyCamera},0);
tl.to('#intro-shade',{opacity:.88,duration:.74,ease:'power2.out'},1.10);
tl.fromTo('#intro-mind',{opacity:0,x:-260,y:-35,rotation:-18,scale:1.18},{opacity:1,x:0,y:0,rotation:0,scale:1,duration:.65,ease:'expo.out'},1.02);
tl.fromTo('#intro-act',{opacity:0,x:260,y:35,rotation:18,scale:1.18},{opacity:1,x:0,y:0,rotation:0,scale:1,duration:.65,ease:'expo.out'},1.12);
