<script>(function(){
const tl=gsap.timeline({paused:true});
// A deliberate type hit opens a clean conceptual scene after the three examples.
tl.fromTo('#coord-surface',{clipPath:'inset(0% 100% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:.42,ease:'power3.inOut'},0);
tl.fromTo('#coord-title-first',{opacity:0,y:56},{opacity:1,y:0,duration:.55,ease:'expo.out'},.18);
tl.fromTo('#coord-title-second',{opacity:0,y:56},{opacity:1,y:0,duration:.6,ease:'power4.out'},.29);
tl.fromTo('#coord-mind',{opacity:0,x:-90,y:24,scale:.92},{opacity:1,x:0,y:0,scale:1,duration:.68,ease:'power3.out'},.42);
tl.fromTo('#coord-act',{opacity:0,x:90,y:24,scale:.92},{opacity:1,x:0,y:0,scale:1,duration:.68,ease:'power3.out'},.50);
tl.fromTo(['#coord-mind-initial','#coord-act-initial'],{opacity:0,y:20},{opacity:1,y:0,duration:.45,ease:'power3.out'},.7);
// The loop is one seekable state: both tracks draw on together (the relationship exists
// before anything travels), then a comet carries intent Mind -> Act, lighting its arc;
// Act takes the hit and the comet returns Act -> Mind as the outcome. A third, faster lap
// is already under way when the diagram clears, so the loop reads as continuous.
const NS=['forward','return'].map(n=>{const p=document.getElementById('coord-'+n),L=p.getTotalLength();
  const e=p.getPointAtLength(L),e2=p.getPointAtLength(L-3);
  return{p,L,end:e,ang:Math.atan2(e.y-e2.y,e.x-e2.x)*180/Math.PI,
    lit:document.getElementById('coord-'+n+'-lit'),head:document.getElementById('coord-'+n+'-head'),
    chev:document.getElementById('coord-'+n+'-chevron'),trail:[0,1,2].map(i=>document.getElementById('coord-'+n+'-trail'+i))};});
const p2io=u=>u<.5?2*u*u:1-2*(1-u)*(1-u),p2o=u=>1-(1-u)*(1-u),clamp=u=>Math.min(1,Math.max(0,u));
const backOut=u=>{const c=1.6;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);};   // one overshoot
// [lane, depart, arrive]; the 3rd leg is the next forward lap, cut off by the 4.43s clear.
const LEGS=[[0,1.30,2.40],[1,2.62,3.72],[0,3.86,4.80]];
const TRACK_T0=.86,TRACK_DUR=.46,TRAILS=[150,85,38];
function setDash(el,len,L,offset){el.setAttribute('stroke-dasharray',`${Math.max(0,len)} ${L+400}`);el.setAttribute('stroke-dashoffset',-offset);}
function applyLoop(t){
  const draw=p2io(clamp((t-TRACK_T0)/TRACK_DUR));
  NS.forEach((n,k)=>{
    setDash(n.p,n.L*draw,n.L,0);
    // Most recent leg on this lane decides its lit / head / chevron state.
    let leg=null;LEGS.forEach(g=>{if(g[0]===k&&t>=g[1])leg=g;});
    const firstArrive=LEGS.find(g=>g[0]===k)[2];
    let litLen=0,litOp=1,headD=-1,headS=0;
    if(leg){const u=clamp((t-leg[1])/(leg[2]-leg[1])),e=p2io(u);headD=n.L*e;
      headS=Math.min(p2o(clamp((t-leg[1])/.14)),1-p2o(clamp((t-leg[2]+.04)/.16)));
      litLen=leg===LEGS[2]||t<firstArrive?headD:n.L;
      if(t>=firstArrive&&leg!==LEGS[2])litOp=.55+.45*(1-p2o(clamp((t-firstArrive)/.5)));}
    if(t>=firstArrive&&leg===LEGS[2]){litLen=n.L;}            // lap 3 rides on an already-lit arc
    setDash(n.lit,litLen,n.L,0);n.lit.setAttribute('opacity',litOp.toFixed(3));
    n.trail.forEach((tr,i)=>{const len=Math.min(TRAILS[i],Math.max(0,headD))*(headS>0?1:0);setDash(tr,len,n.L,Math.max(0,headD-len));});
    if(headD>=0&&headS>0){const pt=n.p.getPointAtLength(Math.min(n.L,headD));n.head.setAttribute('transform',`translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) scale(${headS.toFixed(3)})`);n.head.setAttribute('opacity','1');}
    else n.head.setAttribute('opacity','0');
    const cu=clamp((t-firstArrive+.06)/.3),cs=t<firstArrive-.06?0:backOut(cu);
    n.chev.setAttribute('transform',`translate(${n.end.x.toFixed(2)} ${n.end.y.toFixed(2)}) rotate(${n.ang.toFixed(2)}) scale(${Math.max(0,cs).toFixed(3)})`);
  });}
const loopClock={t:0};
applyLoop(0);
tl.to(loopClock,{t:4.7,duration:4.7,ease:'none',onUpdate:()=>applyLoop(loopClock.t)},0);
// Each mark takes the arrival: a quick 4% swell about its own center, then settles.
// (.coord-symbol scales from 0 0, so x/y compensate to keep the center fixed.)
[['#coord-act',2.40,479.57],['#coord-mind',3.72,450.65]].forEach(([id,at,h])=>{
  tl.to(id,{scale:1.04,x:-9.8,y:-h*.02,duration:.12,ease:'power2.out'},at);
  tl.to(id,{scale:1,x:0,y:0,duration:.3,ease:'power2.inOut'},at+.12);});
// Original Mind and Act marks move together with the third, connector component.
tl.to(['#coord-paths','#coord-intent','#coord-outcomes','#coord-mind-initial','#coord-act-initial'],{opacity:0,duration:.26,ease:'power2.in'},4.43);
tl.to('#coord-mind',{x:404.5,y:-114.9,scale:1.239,duration:1.0,ease:'power3.inOut'},4.63);
tl.to('#coord-act',{x:-558,y:13,scale:1.123,duration:1.0,ease:'power3.inOut'},4.63);
['#coord-dot-a','#coord-dot-b','#coord-dot-c'].forEach((id,i)=>tl.fromTo(id,{opacity:0,scale:.25,y:38},{opacity:1,scale:1,y:0,duration:.4,ease:'back.out(1.35)'},4.77+i*.11));
tl.to(['#coord-mind','#coord-act','#coord-connector'],{opacity:0,duration:.19,ease:'sine.inOut'},5.58);
tl.to('#coord-whole',{opacity:1,duration:.19,ease:'sine.inOut'},5.58);
tl.fromTo('#coord-whole-name',{opacity:0,scale:1.45,y:0},{opacity:1,scale:1.45,y:0,duration:.38,ease:'power2.out'},5.76);
// Keep the complete mark intact. Pull back and reveal its two peer categories;
// there are no arrows or sequential stages in this final three-way taxonomy.
tl.to('#coord-loop-title',{opacity:0,y:-28,duration:.3,ease:'power2.in'},6.94);
tl.to('#coord-whole',{x:128,y:280,scale:.55862069,duration:1.13,ease:'power3.inOut'},7.12);
tl.to('#coord-whole-name',{scale:1,duration:1.13,ease:'power3.inOut'},7.12);
tl.fromTo('#coord-triad-title',{opacity:0,y:34},{opacity:1,y:0,duration:.67,ease:'expo.out'},7.22);
tl.fromTo('#coord-mind',{opacity:0,x:404.5,y:-114.9,scale:1.239},{opacity:1,x:147,y:-100,scale:.86734694,duration:1.0,ease:'power3.out',immediateRender:false},7.35);
tl.fromTo('#coord-act',{opacity:0,x:-558,y:13,scale:1.123},{opacity:1,x:-133,y:-85,scale:.81632653,duration:1.0,ease:'power3.out',immediateRender:false},7.43);
tl.fromTo(['#coord-mind-final','#coord-act-final'],{opacity:0,y:24},{opacity:1,y:0,duration:.48,stagger:.08,ease:'power3.out'},8.15);
tl.fromTo('#coord-whole-caption',{opacity:0,y:18},{opacity:1,y:0,duration:.48,ease:'power3.out'},8.45);
window.__timelines['coordination']=tl;
})();</script>
