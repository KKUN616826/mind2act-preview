<div class="demo-hero" data-phase="observe" aria-label="Keyboard sequence: remember, act, confirm">
  <div class="demo-scene">
    <video class="demo-video" id="hero-demo-video" muted loop playsinline preload="auto" poster="media/posters/CP05_hero_hard_1080p.jpg" aria-label="Robot observes and reproduces a keyboard sequence">
      <source src="media/videos/CP05_hero_hard_1080p.mp4" type="video/mp4">
    </video>
    <div class="demo-shade" aria-hidden="true"></div>
    <div class="demo-key-focus" data-active="false" aria-hidden="true"><span class="demo-key-halo"></span><span class="demo-key-ring"></span><span class="demo-key-core"></span></div>
  </div>
  <svg class="demo-connection" aria-hidden="true">
    <defs>
      <marker id="demo-target-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke"/></marker>
      <marker id="demo-outcome-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke"/></marker>
    </defs>
    <g class="demo-intent-link" data-active="false"><path class="demo-connection-line" marker-end="url(#demo-target-arrow)"/><circle class="demo-connection-origin" r="3"/><circle class="demo-connection-target" r="3"/><text class="demo-link-label">Target</text></g>
    <g class="demo-outcome-link" data-active="false"><path class="demo-outcome-line" marker-end="url(#demo-outcome-arrow)"/><circle class="demo-outcome-pulse" r="3"/><text class="demo-link-label">Registered</text></g>
  </svg>
  <img class="demo-capture" alt="" aria-hidden="true" hidden>
  <aside class="demo-moon-panel">
    <div class="demo-moon" role="img" aria-label="Mind2Act moon: illumination follows the demonstration">
      <img class="demo-moon-upper" src="media/images/moon-upper-extracted.png" alt="">
      <img class="demo-moon-lower" src="media/images/moon-lower-extracted.png" alt="">
      <img class="demo-moon-signals" src="media/images/moon-signals-extracted.png" alt="">
      <img class="demo-moon-stars" src="media/images/moon-stars-extracted.png" alt="">
    </div>
    <h2 class="demo-brand">Mind<span>2</span>Act</h2>
  <div class="demo-chapters" role="group" aria-label="Mind and Act coordinate through feedback">
      <span>Mind</span><span class="demo-bidirectional" aria-hidden="true">↔</span><span>Act</span>
    </div>
  </aside>
  <section class="demo-copy">
    <p class="demo-stage" hidden>MIND <span class="demo-speed">2.25× source speed</span></p>
    <h1 class="demo-title">Remember the order.</h1>
  </section>
  <div class="demo-workspace">
    <section class="demo-memory" aria-label="Illustrative task memory">
      <div class="demo-panel-heading" hidden><h2>Remembered sequence</h2><span class="demo-count">0 / 12</span></div>
      <div class="demo-memory-window" role="region" aria-label="Remembered screenshots; current step follows the demonstration">
        <ol class="demo-memory-strip">__HERO_CARDS__</ol>
        <p class="demo-memory-empty">Memory</p>
      </div>
      <div class="demo-memory-footer" hidden><span class="demo-step">Watch · Remember</span><span class="demo-feedback">Waiting for the first key</span></div>
    </section>
    <section class="demo-motion" aria-label="Recorded left and right stick-tip heights" hidden>
      <div class="demo-panel-heading"><h2>Recorded tip height · cm</h2></div>
      <svg class="demo-chart" viewBox="0 0 360 176" role="img" aria-labelledby="demo-chart-title demo-chart-description">
        <title id="demo-chart-title">Left and right stick-tip height</title>
        <desc id="demo-chart-description">Recorded simulation heights in world coordinates, in centimeters. Both plots use the same time and height scales. Dots mark confirmed key triggers, not curve minima.</desc>
        <defs><clipPath id="demo-motion-reveal"><rect x="40" y="0" width="0" height="149"/></clipPath></defs>
        <g class="demo-chart-grid"></g>
        <g clip-path="url(#demo-motion-reveal)"><path class="demo-trace demo-trace-left"/><path class="demo-trace demo-trace-right"/></g>
        <g class="demo-chart-events"></g>
        <line class="demo-chart-cursor" x1="40" x2="40" y1="17" y2="143"/>
        <circle class="demo-chart-head demo-trace-left" r="3.5"/>
        <circle class="demo-chart-head demo-trace-right" r="3.5"/>
      </svg>
    </section>
  </div>
  <p class="demo-phase-status" role="status" aria-live="polite">Mind · Remember the order.</p>
  <p class="demo-evidence" hidden>Simulation demonstration <span>·</span> Illustrative memory overlay</p>
  <div class="demo-controls" role="group" aria-label="Demo playback controls">
    <button class="demo-play" type="button" aria-label="Play demo" aria-pressed="false" disabled>
      <svg class="demo-play-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="demo-pause-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </div>
  <noscript><p class="demo-no-script">Enable JavaScript for synchronized memory and motion. <a href="media/videos/CP05_hero_hard_1080p.mp4">Watch the demonstration</a>.</p></noscript>
</div>
<script id="heroDemoData" type="application/json">__HERO_DATA__</script>
